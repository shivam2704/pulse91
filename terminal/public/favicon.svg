<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="10" y1="44" x2="54" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Terminal Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#10b981" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Subtle Quant Grid Lines -->
  <path d="M16 14V50M32 14V50M48 14V50M14 22H50M14 42H50" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.7"/>

  <!-- Pulse Breakout Waveform -->
  <path d="M11 38H20L25 26L31 44L38 19L43 32H53" stroke="url(#pulseGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Live Breakout Dot -->
  <circle cx="53" cy="32" r="3" fill="#34d399"/>
</svg>
